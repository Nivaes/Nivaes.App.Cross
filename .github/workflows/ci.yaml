name: CI

on:
  push:
    branches-ignore:
    - 'release/v**'
    paths-ignore:
    - '**/*.md'
    - '**/*.sln'
  pull_request:
    #types: [opened, synchronize, reopened]
    types: [synchronize]
    paths-ignore:
    - '**/*.md'
    - '**/*.sln'

permissions:
  contents: read
  packages: read

jobs:
  build-app-cross:
    runs-on: ubuntu-22.04

    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"

    - name: Variables
      run: |
        echo ${{ github.repository_owner }}
        echo ${{ github.actor }}
        echo ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Authenticate with GitHub Packages
      run: dotnet nuget add source 
        --username ${{ github.actor }} 
        --password ${{ secrets.NUGET_AUTH_TOKEN }} 
        --store-password-in-clear-text 
        --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: Restore Dependencies
      run: |
          # dotnet restore sources/Nivaes.App.Cross --configfile .github/NuGet.Config --verbosity diagnostic
          dotnet restore sources/Nivaes.App.Cross --verbosity diagnostic
          # dotnet restore sources/Nivaes.App.Cross.SourceGenerator --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.AppKit --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.AppKit.SourceGenerator --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.Droid --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.Droid.SourceGenerator --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.UIKit --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.UIKit.SourceGenerator --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.WinUI --configfile .github/NuGet.Config
          # dotnet restore sources/Nivaes.App.Cross.WinUI.SourceGenerator --configfile .github/NuGet.Config

    - name: Build
      run: |
          dotnet build sources/Nivaes.App.Cross --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.SourceGenerator --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.AppKit --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.AppKit.SourceGenerator --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.Droid --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.Droid.SourceGenerator --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.UIKit --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.UIKit.SourceGenerator --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.WinUI --configuration Release --no-restore
          dotnet build sources/Nivaes.App.Cross.WinUI.SourceGenerator --configuration Release --no-restore

    - name: Test
      run: |
          dotnet test sources/Nivaes.App.Cross --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.SourceGenerator --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.AppKit --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.AppKit.SourceGenerator --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.Droid --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.Droid.SourceGenerator --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.UIKit --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.UIKit.SourceGenerator --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.WinUI --configuration Release --no-build --verbosity normal --no-restore
          dotnet test sources/Nivaes.App.Cross.WinUI.SourceGenerator --configuration Release --no-build --verbosity normal --no-restore

