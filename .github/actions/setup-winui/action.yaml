name: WinUI setup
description: Configures .NET and WinUI SDK for WinUI builds

inputs:
  global-json-file:
    description: Path to global.json
    required: false
    default: global.json

runs:
  using: composite

  steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ${{ inputs.global-json-file }}
        cache: true
        cache-dependency-path: |
          **/packages.lock.json
          
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
